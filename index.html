<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; background: #f9fbfd; color: #1f1f1f; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; }
  [hidden] { display: none !important; }

  /* ---------- 문서 화면 (Google Docs 모양) ---------- */
  #lovable-badge { display: none !important; }
  #doc { height: 100%; display: flex; flex-direction: column; font-family: "Google Sans", Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; background: #f9fbfd; }
  .ic { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }

  .d-top { display: flex; align-items: center; padding: 8px 16px 0 12px; height: 64px; flex: none; }
  .d-icon { width: 30px; height: 40px; flex: none; margin: 0 10px 0 4px; }
  .d-head { min-width: 0; flex: 1; }
  .d-titlerow { display: flex; align-items: center; gap: 2px; color: #444746; }
  .d-title { font-size: 18px; line-height: 24px; font-family: inherit; border: 1px solid transparent; border-radius: 4px; padding: 0 6px; min-width: 40px; max-width: 420px; field-sizing: content; background: none; color: #1f1f1f; }
  .d-title:hover { border-color: #747775; }

  .d-menu span:hover { background: rgba(68,71,70,.08); }
  .d-right { display: flex; align-items: center; gap: 6px; color: #444746; flex: none; }
  .d-rb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .d-rb:hover { background: rgba(68,71,70,.08); }
  .d-meet { display: flex; align-items: center; height: 36px; padding: 0 6px 0 10px; border-radius: 18px; }
  .d-meet:hover { background: rgba(68,71,70,.08); }
  .d-share { display: flex; align-items: center; gap: 8px; background: #c2e7ff; color: #001d35; border-radius: 24px; height: 40px; padding: 0 24px 0 16px; font-size: 14px; font-weight: 500; margin: 0 6px; }
  .d-share:hover { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
  .d-avatar { width: 32px; height: 32px; border-radius: 50%; background: #7b5ea7; color: #fff; display: grid; place-items: center; font-size: 14px; margin-left: 4px; }
  .d-tools { display: flex; align-items: center; gap: 1px; background: #edf2fa; margin: 6px 8px 0; border-radius: 24px; height: 40px; padding: 0 8px; font-size: 14px; color: #444746; flex: none; overflow: hidden; }
  .d-tools > * { flex: none; }
  .d-tb { height: 28px; min-width: 28px; padding: 0 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: #444746; cursor: default; }
  button.d-tb { cursor: pointer; }
  .d-tb:hover { background: rgba(68,71,70,.08); }
  .d-search { gap: 8px; padding: 0 12px 0 8px; height: 28px; border-radius: 14px; background: #fff0; color: #444746; }
  .d-dd { padding: 0 6px; }
  .d-dd .ic { width: 18px; height: 18px; }
  .d-font { min-width: 72px; justify-content: space-between; }
  .d-style { min-width: 92px; justify-content: space-between; }
  .d-size { display: inline-flex; align-items: center; }
  .d-size input { font: inherit; border: 1px solid #747775; border-radius: 4px; width: 34px; height: 24px; text-align: center; margin: 0 2px; color: #1f1f1f; background: transparent; padding: 0; }
  .d-size input:focus { outline: 2px solid #0b57d0; outline-offset: -1px; }
  .d-tb.on { background: #d3e3fd; }
  .d-chatbtn { position: relative; color: inherit; }
  .d-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #0b57d0; }
  #d-people { display: flex; }
  #d-people .d-avatar { margin-left: -6px; border: 2px solid #f9fbfd; box-sizing: content-box; }
  #d-chat { position: fixed; right: 16px; top: 112px; bottom: 16px; width: 340px; max-width: calc(100vw - 32px); background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); z-index: 45; display: flex; flex-direction: column; font-size: 14px; color: #1f1f1f; }
  .dc-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 10px 16px; font-size: 16px; border-bottom: 1px solid #e3e3e3; }
  .dc-head button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #444746; }
  .dc-head button:hover { background: rgba(68,71,70,.08); }
  .dc-list { flex: 1; overflow: auto; padding: 4px 12px; }
  .dc-msg { background: #f8fafd; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .dc-who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dc-av { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
  .dc-name b { font-weight: 500; }
  .dc-time { color: #5f6368; font-size: 12px; }
  .dc-text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  .dc-empty { color: #5f6368; text-align: center; margin: 24px 0; }
  .dc-note { color: #b3261e; font-size: 13px; margin: 0; padding: 0 16px; }
  .dc-note:empty { display: none; }
  .dc-form, form.dc-name { border-top: 1px solid #e3e3e3; padding: 12px; }
  form.dc-name label { display: block; margin-bottom: 6px; color: #444746; }
  .dc-form textarea, form.dc-name input { width: 100%; box-sizing: border-box; border: 1px solid #747775; border-radius: 4px; padding: 8px 10px; font: inherit; resize: none; outline: none; }
  .dc-form textarea:focus, form.dc-name input:focus { border-color: #0b57d0; box-shadow: inset 0 0 0 1px #0b57d0; }
  .dc-btns { display: flex; justify-content: flex-end; margin-top: 8px; }
  .dc-send { background: #0b57d0; color: #fff; border-radius: 18px; padding: 6px 16px; font-size: 14px; }
  .d-font .lbl { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #d-pop { position: fixed; z-index: 70; background: #fff; border-radius: 4px; box-shadow: 0 2px 6px 2px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3); padding: 6px 0; font-size: 14px; color: #1f1f1f; max-height: 70vh; overflow: auto; min-width: 140px; }
  #d-pop .d-pi { padding: 6px 16px; cursor: pointer; white-space: nowrap; }
  #d-pop .d-pi:hover { background: #f1f3f4; }
  #d-pop .d-pi.cur { background: #e8f0fe; }
  #d-pop .d-swatches { display: grid; grid-template-columns: repeat(10, 20px); gap: 4px; padding: 6px 12px; }
  #d-pop .d-sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #dadce0; cursor: pointer; font-size: 0; }
  #d-pop .d-none { padding: 6px 12px; cursor: pointer; }
  #d-count, #d-keys, #d-log { position: fixed; inset: 0; z-index: 80; background: rgba(32,33,36,.6); display: grid; place-items: center; }
  #d-count[hidden], #d-keys[hidden], #d-log[hidden] { display: none; }
  /* 첫 방문 안내일 때만 보이는 부분 (.intro가 붙은 창) */
  #d-keys:not(.intro) .d-intro, #d-log:not(.intro) .d-intro, #d-keys.intro .d-notintro, #d-log.intro .d-notintro { display: none; }
  p.d-intro { margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: #0b57d0; background: #e8f0fe; border-radius: 8px; padding: 10px 12px; }
  .d-log ul { margin: 0 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.6; color: #3c4043; }
  .d-keys { width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; }
  .d-keys h4 { margin: 18px 0 6px; font-size: 14px; color: #1f1f1f; text-align: left; }
  .d-keys th { padding: 0; }
  .d-keys td:first-child { white-space: nowrap; padding-right: 16px; width: 1%; }
  .d-dialog.d-keys td + td { text-align: left; color: #3c4043; }
  .d-keys kbd { font: 12px/1 Roboto Mono, Consolas, monospace; background: #f1f3f4; border: 1px solid #dadce0; border-radius: 4px; padding: 3px 6px; }
  .d-dialog { background: #fff; border-radius: 8px; padding: 24px; min-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .d-dialog h3 { margin: 0 0 16px; font-weight: 400; font-size: 22px; }
  .d-dialog table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .d-dialog td { padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
  .d-dialog td + td { text-align: right; }
  .d-dialog-btns { text-align: right; margin-top: 16px; }
  .d-dialog-btns button { background: #0b57d0; color: #fff; border-radius: 18px; padding: 8px 20px; font-size: 14px; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    #music, #quick, #yt-wrap, #menu, #toast, #d-pop, #d-count, #d-keys, #d-log, #d-chat, .d-top, .d-tools, .d-ruler, .d-outline { display: none !important; }
    #doc, .d-canvas { display: block; height: auto; overflow: visible; background: #fff; }
    .d-pages { padding: 0; }
    .d-page { box-shadow: none; margin: 0; padding: 0; width: auto; max-width: none; min-height: 0; zoom: 1 !important; }
  }
  .d-color { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .d-color i { display: block; width: 16px; height: 3px; background: #000; margin-top: -3px; }
  .d-sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; }
  .d-mode { gap: 6px; padding: 0 8px; margin-left: auto; }
  .d-canvas { flex: 1; overflow: auto; position: relative; }
  .d-ruler { position: sticky; top: 0; z-index: 2; height: 24px; background: #f9fbfd; display: flex; justify-content: center; padding-top: 4px; }
  .d-ruler div { width: 816px; max-width: calc(100% - 32px); height: 18px; border-bottom: 1px solid #dadce0;
    background:
      linear-gradient(#dadce0, #dadce0) 0 0 / 96px 100% no-repeat,
      linear-gradient(#dadce0, #dadce0) 100% 0 / 96px 100% no-repeat,
      repeating-linear-gradient(90deg, #80868b 0 1px, transparent 1px 48px) 0 100% / 100% 8px no-repeat,
      repeating-linear-gradient(90deg, #bdc1c6 0 1px, transparent 1px 12px) 0 100% / 100% 4px no-repeat,
      #fff;
  }
  .d-outline { position: absolute; left: 20px; top: 40px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #444746; }
  .d-outline:hover { background: rgba(68,71,70,.08); }
  .d-pages { padding: 8px 0 80px; }
  .d-page { background: #fff; width: 816px; max-width: calc(100% - 32px); min-height: 1056px; margin: 0 auto; padding: 96px; border: 1px solid #c7c7c7; border-width: 0; box-shadow: 0 0 0 .75pt #d1d1d1, 0 0 3pt .75pt #ccc; font: 11pt/1.15 Arial, "Malgun Gothic", sans-serif; color: #000; outline: none; }
  .d-page h1 { font: 400 26pt/1.15 Arial, "Malgun Gothic", sans-serif; margin: 0 0 3pt; }
  .d-page h2 { font: 400 20pt/1.15 Arial, "Malgun Gothic", sans-serif; margin: 20pt 0 6pt; }
  .d-page h3 { font: 400 16pt/1.15 Arial, "Malgun Gothic", sans-serif; margin: 16pt 0 4pt; }
  .d-page h4 { font: 400 14pt/1.15 Arial, "Malgun Gothic", sans-serif; color: #434343; margin: 14pt 0 4pt; }
  .d-page h5 { font: 400 15pt/1.15 Arial, "Malgun Gothic", sans-serif; color: #666; margin: 0 0 16pt; }
  .d-page p { margin: 0; }
  .d-page ul, .d-page ol { margin: 0; padding-left: 36pt; }
  .d-page li { padding-left: 4pt; }
  @media (max-width: 1180px) { .d-search span, .d-hide-m { display: none !important; } }
  @media (max-width: 900px) { .d-meet, .d-hide-s, .d-meta { display: none !important; } .d-page { padding: 48px 32px; } .d-outline { display: none; } }

  /* ---------- 음악 화면 ---------- */
  #music { position: fixed; inset: 0; background: #000; color: #fff; display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: 1fr 84px; gap: 8px; padding: 8px 8px 0; z-index: 20; }
  #music.no-queue { grid-template-columns: 240px 1fr; }
  #music.no-queue .m-queue { display: none; }
  .m-pan { background: #121212; border-radius: 8px; overflow: auto; min-height: 0; }
  .m-side { padding: 12px 8px; display: flex; flex-direction: column; }
  .m-nav { padding: 4px 4px 12px; }
  .m-nav button, .m-lib button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; color: #b3b3b3; font-size: 14px; }
  .m-nav button:hover, .m-lib button:hover { color: #fff; background: #1f1f1f; }
  .m-nav button.on, .m-lib button.on { color: #fff; background: #232323; }
  .m-label { color: #b3b3b3; font-size: 13px; font-weight: 700; padding: 10px 10px 6px; display: flex; justify-content: space-between; }
  .m-lib { flex: 1; overflow: auto; }
  .m-sq { width: 40px; height: 40px; border-radius: 4px; flex: none; object-fit: cover; background: #333; display: grid; place-items: center; font-size: 18px; }
  .m-libtxt { min-width: 0; }
  .m-libtxt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-libtxt small { color: #8a8a8a; font-size: 12px; }
  .m-main { padding: 16px 24px 40px; position: relative; }
  .m-main h2 { font-size: 24px; margin: 8px 0 14px; }
  .m-main h3 { font-size: 18px; margin: 24px 0 10px; }
  .m-searchbar { display: flex; gap: 8px; margin-bottom: 18px; }
  .m-searchbar input { flex: 1; background: #242424; color: #fff; border: 1px solid #333; border-radius: 22px; padding: 11px 18px; outline: none; }
  .m-searchbar input:focus { border-color: #fff; }
  .m-hint { color: #8a8a8a; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: #181818; border-radius: 8px; padding: 12px; text-align: left; transition: background .15s; }
  .card:hover { background: #262626; }
  .card img, .card .art { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #333; display: grid; place-items: center; font-size: 40px; }
  .card .t1 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .t2 { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { display: flex; gap: 20px; align-items: flex-end; padding: 20px; margin: -16px -24px 16px; background: linear-gradient(#7a3b2e, #121212); }
  .hero.liked { background: linear-gradient(#4a3a9c, #121212); }
  .hero .art { width: 150px; height: 150px; border-radius: 6px; flex: none; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,.5); background: #333; display: grid; place-items: center; font-size: 60px; }
  .hero small { color: #ddd; }
  .pl-name { background: none; border: 1px solid transparent; color: #fff; font-size: 40px; font-weight: 800; width: 100%; padding: 0 4px; border-radius: 4px; }
  .pl-name:hover, .pl-name:focus { border-color: #555; outline: none; }
  .hero h1 { font-size: 40px; margin: 4px 0; }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bigplay { width: 52px; height: 52px; border-radius: 50%; background: #ff7a59; color: #000; font-size: 20px; display: grid; place-items: center; }
  .bigplay:hover { transform: scale(1.04); background: #ff9070; }
  .pill { border: 1px solid #555; border-radius: 16px; padding: 6px 14px; font-size: 13px; color: #ddd; }
  .pill:hover { border-color: #fff; color: #fff; }
  .pill.danger { border-color: #a33; color: #f88; }
  .trk { display: grid; grid-template-columns: 28px 44px minmax(0, 1fr) 56px 30px 30px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; color: #b3b3b3; font-size: 14px; cursor: pointer; }
  .trk:hover { background: #2a2a2a; }
  .trk.cur { color: #ff8a65; }
  .trk.cur .t1 { color: #ff8a65; }
  .trk img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; background: #333; }
  .trk .n { text-align: center; }
  .trk .t1 { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .t2 { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk button { color: #8a8a8a; font-size: 16px; border-radius: 50%; width: 30px; height: 30px; }
  .trk button:hover { color: #fff; background: #3a3a3a; }
  .liked-on { color: #ff7a59 !important; }
  .mi { width: 20px; height: 20px; fill: currentColor; vertical-align: middle; flex: none; }
  .m-sq .mi { width: 22px; height: 22px; color: #fff; }
  .card .art .mi { width: 40%; height: 40%; color: #fff; }
  .hero .art .mi { width: 56px; height: 56px; color: #fff; }
  .bigplay .mi { width: 28px; height: 28px; }
  .trk .n .mi { width: 16px; height: 16px; color: #ff8a65; }
  #menu .mi { width: 18px; height: 18px; margin: -2px 6px 0 0; }
  #quick .mi { width: 18px; height: 18px; }
  #quick li button { color: #5f6368; border-radius: 50%; width: 26px; height: 22px; display: grid; place-items: center; }
  #quick li button:hover { background: #e8eaed; }
  #quick .q-ctl button { display: flex; align-items: center; justify-content: center; gap: 1px; }
  #quick .q-ctl small { font-size: 10px; }
  #video-slot { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; margin: 0 auto; display: grid; place-items: center; color: #666; }
  .m-queue { padding: 16px; }
  .m-queue h4 { margin: 0 0 8px; font-size: 15px; }
  .m-queue .trk { grid-template-columns: 40px minmax(0, 1fr) 26px; }
  .m-queue .trk img { width: 40px; height: 40px; }
  .set [data-dislike-list] { max-width: 560px; }
  .set [data-dislike-list] .trk { grid-template-columns: 44px minmax(0, 1fr) auto; cursor: default; }
  .set [data-dislike-list] .trk button.pill { width: auto; height: auto; border-radius: 16px; font-size: 13px; }
  .m-bar { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(320px, 2fr) minmax(180px, 1fr); align-items: center; padding: 0 8px; }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #222; }
  .now .t1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .t2 { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ctl-btns { display: flex; align-items: center; gap: 18px; }
  .ctl-btns button { color: #b3b3b3; font-size: 17px; position: relative; }
  .ctl-btns button:hover { color: #fff; }
  .ctl-btns button.on { color: #ff7a59; }
  .ctl-btns .one { position: absolute; font-size: 9px; top: -4px; right: -6px; }
  .play { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000 !important; font-size: 14px !important; display: grid; place-items: center; }
  .seek { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; color: #a7a7a7; }
  .seek span { width: 40px; text-align: center; }
  input[type=range] { flex: 1; accent-color: #ff7a59; height: 4px; cursor: pointer; }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #b3b3b3; }
  .right button:hover { color: #fff; }
  .right button.on { color: #ff7a59; }
  .right input[type=range] { max-width: 110px; }
  .set label { display: block; margin: 14px 0 4px; color: #ddd; font-size: 14px; }
  .set input[type=text] { width: 100%; max-width: 560px; background: #242424; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 9px 12px; }

  /* ---------- 빠른 패널 ---------- */
  #quick { position: fixed; right: 20px; bottom: 20px; width: 340px; max-width: calc(100vw - 32px); background: #fff; border: 1px solid #dadce0; border-radius: 12px; box-shadow: 0 6px 24px rgba(60,64,67,.25); padding: 12px; z-index: 40; font-size: 13px; color: #3c4043; }
  #quick { display: flex; flex-direction: column; }
  #quick .q-head { display: flex; justify-content: space-between; color: #5f6368; margin-bottom: 6px; cursor: move; user-select: none; touch-action: none; }
  #quick .q-resize { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; border-right: 2px solid #c4c7c5; border-bottom: 2px solid #c4c7c5; border-radius: 0 0 8px 0; }
  #quick.sized ul { max-height: none; flex: 1 1 auto; min-height: 0; }
  #quick input[type=text] { width: 100%; border: 1px solid #dadce0; border-radius: 6px; padding: 8px 10px; outline: none; }
  #quick input[type=text]:focus { border-color: #1a73e8; }
  #quick ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 220px; overflow: auto; }
  #quick li { padding: 6px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  #quick li:hover { background: #f1f3f4; }
  #quick li .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #quick li .d { color: #80868b; }
  #quick .q-now { border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; }
  #quick .q-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #202124; }
  #quick .q-seek { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #80868b; margin: 4px 0; }
  #quick input[type=range] { accent-color: #1a73e8; }
  #quick .q-ctl { display: flex; justify-content: space-between; gap: 4px; }
  #quick .q-ctl button { flex: 1; background: #f1f3f4; border-radius: 6px; padding: 5px 0; font-size: 12px; color: #3c4043; }
  #quick .q-ctl button:hover { background: #e8eaed; }
  #quick .q-ctl button.on { background: #d2e3fc; }

  /* ---------- 플레이어 / 기타 ---------- */
  #yt-wrap { position: fixed; z-index: 30; }
  #yt-wrap.hide { left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  #yt-wrap.show { border-radius: 8px; overflow: hidden; }
  #yt-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  #menu { position: fixed; z-index: 60; background: #282828; color: #eee; border-radius: 6px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 14px; max-height: 60vh; overflow: auto; }
  #menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 4px; }
  #menu button:hover { background: #3e3e3e; }
  #menu hr { border: 0; border-top: 1px solid #3e3e3e; margin: 4px 0; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #323232; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 70; pointer-events: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  #music ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 5px; }
</style>
</head>

// @@autoplay-pure-start
// mine: 내 기록, mix: 지금 곡의 YouTube 믹스, taste: 내 취향 곡의 믹스, popular: 인기 음악
const AUTO_WEIGHTS = { mine: 50, mix: 30, taste: 15, popular: 5 };
// 싫어요: 아예 막지 않고 덜 나오게. 그 곡 자체, 같은 채널, 그 곡 YouTube 믹스에 있던 곡 (해당되면 곱해짐)
const DISLIKE = { self: 0.1, artist: 0.5, similar: 0.8 };
// 링크로 붙여 넣은 곡의 채널 자리 (가수가 아니므로 같은 가수 감점에서 뺀다)
const LINK_CHANNEL = '링크로 추가';
function dislikeIndex(disliked) {
  const idx = { ids: new Set(), channels: new Set(), similar: new Set() };
  for (const d of disliked) {
    idx.ids.add(d.t.id);
    if (d.t.channel && d.t.channel !== LINK_CHANNEL) idx.channels.add(d.t.channel);
    for (const id of Array.isArray(d.similar) ? d.similar : []) idx.similar.add(id);
  }
  return idx;
}
function penaltyOf(t, idx) {
  return (idx.ids.has(t.id) ? DISLIKE.self : 1) * (idx.channels.has(t.channel) ? DISLIKE.artist : 1) * (idx.similar.has(t.id) ? DISLIKE.similar : 1);
}
// 곡 목록(Track 또는 {t,w})을 싫어요 반영한 {t,w,w0}로. w0은 감점 전 값 (묶음 비중 계산에 씀)
function weigh(items, idx) {
  return items.map(x => (x.t ? { t: x.t, w: x.w * penaltyOf(x.t, idx), w0: x.w0 ?? x.w } : { t: x, w: penaltyOf(x, idx), w0: 1 }));
}
function scoreOf(stat, liked) {
  return (stat ? stat.plays - 2 * stat.skips : 0) + (liked ? 3 : 0);
}
function minePool(stats, likedTracks) {
  const liked = new Set(likedTracks.map(t => t.id));
  const pool = [];
  for (const id in stats) {
    const w = scoreOf(stats[id], liked.has(id));
    if (w > 0) pool.push({ t: stats[id].t, w });
  }
  for (const t of likedTracks) if (!stats[t.id]) pool.push({ t, w: scoreOf(undefined, true) });

}
// 비중대로 묶음을 고르고 그 안에서 한 곡. 제외 후 후보가 남은 묶음만 고려하므로 모두 비면 null.
// 묶음 비중에는 그 묶음이 싫어요로 깎인 만큼(w 합 / w0 합)을 곱한다: 비슷한 곡뿐인 묶음은 덜 뽑힌다.
function pickNext(pools, weights, exclude, rng) {
  const avail = {}, pw = {};

  for (const k in weights) {
    const items = (pools[k] || []).map(x => (x.t ? x : { t: x, w: 1 })).filter(x => !exclude.has(x.t.id));
    if (!items.length) continue;
    const w0 = items.reduce((s, x) => s + (x.w0 ?? x.w), 0);
    avail[k] = items; pw[k] = weights[k] * (w0 ? items.reduce((s, x) => s + x.w, 0) / w0 : 1);
    total += pw[k];

  let r = rng() * total, from;
  for (from in avail) { r -= pw[from]; if (r < 0) break; }

  let w = rng() * items.reduce((s, x) => s + x.w, 0);
  for (const x of items) { w -= x.w; if (w < 0) return { t: x.t, from }; }

const autoplayOn = () => store.settings.autoplay !== false;

// ---------- 검색 ----------
function parseId(s) {
  const m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(s.trim()) ? s.trim() : null);
}
async function search(q) {
  q = q.trim();
  if (!q) return [];
  const id = parseId(q);
  if (id) return [{ id, title: id, channel: LINK_CHANNEL, duration: '', seconds: 0 }];
  let why = '';
  const gas = setting('searchUrl');
  if (gas) {
    try {
      const j = await (await fetch(gas + '?q=' + encodeURIComponent(q))).json();
      if (j.results && j.results.length) return j.results;
      why = j.error || '결과 없음';
    } catch (e) { why = e.message; }
  }
  try {
    const r = await fetch(setting('invidious') + '/api/v1/search?type=video&q=' + encodeURIComponent(q));
    const j = await r.json();
    const out = j.filter(x => x.type === 'video' && x.lengthSeconds > 0)
      .map(x => ({ id: x.videoId, title: x.title, channel: x.author, seconds: x.lengthSeconds, duration: fmt(x.lengthSeconds) }));
    if (out.length) return out;
  } catch (e) {}
  throw new Error('검색 실패' + (why ? ` (${why})` : ''));
}

// 빠른 패널: 위쪽 줄을 끌어 옮기고 오른쪽 아래 모서리로 크기 조절. 위치·크기는 store.settings.quickBox에 기억
const quickEl = $('#quick'), QUICK_MIN = { w: 260, h: 200 };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function placeQuick() {
  const b = store.settings.quickBox, st = quickEl.style;
  quickEl.classList.toggle('sized', !!(b && b.h));
  if (!b) { st.left = st.top = st.width = st.height = st.right = st.bottom = ''; return; }
  st.width = clamp(b.w, QUICK_MIN.w, innerWidth) + 'px';
  st.height = b.h ? clamp(b.h, QUICK_MIN.h, innerHeight) + 'px' : '';
  const r = quickEl.getBoundingClientRect();
  st.right = st.bottom = 'auto';
  st.left = clamp(b.x, 0, innerWidth - r.width) + 'px';
  st.top = clamp(b.y, 0, innerHeight - r.height) + 'px';
}
function saveQuickBox() {
  const r = quickEl.getBoundingClientRect();
  store.settings.quickBox = { x: r.left, y: r.top, w: r.width, h: quickEl.classList.contains('sized') ? r.height : 0 };
  save();
}
function quickPointer(e, onMove) {
  e.preventDefault();
  const r = quickEl.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, st = quickEl.style;
  st.right = st.bottom = 'auto'; st.left = r.left + 'px'; st.top = r.top + 'px'; st.width = r.width + 'px';
  const move = ev => onMove(ev.clientX - sx, ev.clientY - sy, r);
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); saveQuickBox(); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
$('#quick .q-head').addEventListener('pointerdown', e => {
  if (e.target.closest('button') || e.button !== 0) return;
  quickPointer(e, (dx, dy, r) => {
    quickEl.style.left = clamp(r.left + dx, 0, innerWidth - r.width) + 'px';
    quickEl.style.top = clamp(r.top + dy, 0, innerHeight - r.height) + 'px';
  });
});
$('#quick .q-resize').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  quickPointer(e, (dx, dy, r) => {
    // 커질 자리가 없으면 패널을 위·왼쪽으로 밀어 화면 안에 둔다 (손잡이가 화면 밖으로 나가지 않게)
    const w = clamp(r.width + dx, QUICK_MIN.w, innerWidth), h = clamp(r.height + dy, QUICK_MIN.h, innerHeight);
    quickEl.classList.add('sized');
    quickEl.style.width = w + 'px'; quickEl.style.height = h + 'px';
    quickEl.style.left = clamp(r.left, 0, innerWidth - w) + 'px';
    quickEl.style.top = clamp(r.top, 0, innerHeight - h) + 'px';
  });
});
$('#quick .q-head').addEventListener('dblclick', e => {
  if (e.target.closest('button')) return;
  delete store.settings.quickBox; save(); placeQuick();
});

}

// 재생 바 ⤓: 지금 곡 받기 메뉴
function showDlMenu(btn, t = current()) {
  menuTrack = t; menuKey = null; menuIdx = -1;
  $('#menu').innerHTML = DL_ITEMS;
  placeMenu(btn);
}
function placeMenu(btn) {
  const m = $('#menu');
  m.hidden = false;
  const r = btn.getBoundingClientRect();
  const h = m.offsetHeight, w = m.offsetWidth;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h > innerHeight - 8 ? Math.max(8, r.top - h) : r.bottom) + 'px';
}
function hideMenu() { $('#menu').hidden = true; }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

// ---------- 다운로드 (이 컴퓨터의 다운로드 서버가 변환) ----------
const DL_OFF = '다운로드는 이 컴퓨터에서만 돼요 (다운로드 서버가 꺼져 있어요)';
function fileNameOf(cd) {
  const star = /filename\*=UTF-8''([^;]+)/i.exec(cd || '');
  if (star) try { return decodeURIComponent(star[1]); } catch (e) {}
  const plain = /filename="([^"]+)"/i.exec(cd || '');
  return plain ? plain[1] : '';
}
async function downloadTrack(t, fmt) {
  const base = setting('dlUrl'), label = fmt.toUpperCase();
  let job;
  try {
    const r = await fetch(base + '/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: t.id, fmt }) });
    if (!r.ok) throw new Error(r.status);
    job = (await r.json()).job;
  } catch (e) { return toast(DL_OFF); }
  toast(`${label} 만드는 중… 0%`);
  try {
    for (;;) {
      await new Promise(r => setTimeout(r, 1000));
      const res = await fetch(`${base}/jobs/${job}`);
      // 서버가 다시 켜지면 작업이 사라진다: 계속 기다리지 않고 알려 준다
      if (res.status === 404) return toast('받지 못했어요: 다운로드 서버가 다시 켜졌어요. 한 번 더 눌러 주세요');
      const st = await res.json();
      if (st.state === 'error') return toast(`받지 못했어요: ${st.error || ''}`);
      if (st.state === 'done') break;
      toast(`${label} 만드는 중… ${st.progress || 0}%`);
    }
    const r = await fetch(`${base}/jobs/${job}/file`);
    if (!r.ok) throw new Error(r.status);
    const u = URL.createObjectURL(await r.blob()), link = document.createElement('a');
    link.href = u; link.download = fileNameOf(r.headers.get('Content-Disposition')) || `${t.title}.${fmt}`;
    link.click(); setTimeout(() => URL.revokeObjectURL(u), 10000);
    toast('다운로드 폴더에 저장했어요');
  } catch (e) { toast(DL_OFF); }
}

// 다음 곡 버튼·Alt+. : 처음 30초 안에 넘기면 skip으로 센다
function skipNext() { if (!Q.waiting) noteSkip(); next(false); }
// 지금 곡 싫어요 (⊖ 버튼·Alt+X)
function dislikeCurrent() {
  const t = current();
  if (!t) return;
  // 이미 싫어요면 해제. 단 넘길 추천을 기다리는 중에 또 누른 건 무시
  if (isDisliked(t.id)) { if (!Q.waiting) toggleDislike(t); return; }
  toggleDislike(t);
  // 넘길 곡이 없으면 처음(=이 곡)으로 돌아가지 않고 멈춘다
  if (Q.i + 1 < Q.list.length || useAuto() || (store.repeat === 'all' && Q.list.length > 1)) next(false, true);
  else pause();
}

// ---------- 라이브러리 조작 ----------
function toggleLike(t, k = kind()) {
  const B = bucket(k);
  if (isLiked(t.id, k)) B.liked = B.liked.filter(x => x.id !== t.id);
  else { B.liked.unshift(slim(t)); B.disliked = B.disliked.filter(d => d.t.id !== t.id); }
  save(); renderAll();
}
const isDisliked = (id, k) => bucket(k).disliked.some(d => d.t.id === id);
// 싫어요: 좋아요는 풀고, 자동 추천에 있던 그 곡은 빼고, 그 곡의 YouTube 믹스를 '비슷한 곡'으로 기억한다
// 싫어요 해제하면 그때 풀었던 좋아요도 되돌린다 (liked: true로 기억)
function toggleDislike(t, k = kind()) {
  const B = bucket(k);
  const old = B.disliked.find(d => d.t.id === t.id);
  if (old) {
    B.disliked = B.disliked.filter(d => d !== old);
    if (old.liked && !isLiked(t.id, k)) B.liked.unshift(old.t);
    save(); renderAll(); toast('싫어요를 취소했어요');
    return;
  }
  const d = { t: slim(t), similar: [], at: Date.now() };
  if (isLiked(t.id, k)) d.liked = true;
  B.disliked.unshift(d);
  if (B.disliked.length > 200) B.disliked.length = 200;
  B.liked = B.liked.filter(x => x.id !== t.id);
  // 지금 추천은 이 곡 기준으로 뽑혔을 수 있으니 버리고 다시 채운다
  Q.auto = []; Q.autoEpoch++;
  save(); renderAll(); toast('이 곡과 비슷한 곡이 덜 나와요');
  fillSimilar(d);
  refillAuto();
}
// 서버가 실패해서 비슷한 곡이 비었으면 자동 추천을 채울 때 다시 시도한다 (실제로 요청한 횟수로 한 곡당 3번까지)
const similarPending = new Set();
function fillSimilar(d) {
  if (similarPending.has(d.t.id)) return;
  similarPending.add(d.t.id);
  fetchMix(d.t.id).then(r => {
    similarPending.delete(d.t.id);
    d.similar = r.map(x => x.id).filter(id => id !== d.t.id);
    if (d.similar.length) delete d.tries; else d.tries = (d.tries || 0) + 1;
    save();
  });
}
function newPlaylist(withTrack) {
  const p = { id: Date.now().toString(36), name: `내 플레이리스트 #${store.playlists.length + 1}`, tracks: withTrack ? [slim(withTrack)] : [] };
  store.playlists.push(p); save();
  return p;
}
function addToPlaylist(p, t) {
  if (p.tracks.some(x => x.id === t.id)) return toast('이미 들어 있는 곡이에요');
  p.tracks.push(slim(t)); save(); toast(`'${p.name}'에 추가했어요`); renderAll();
}

// ---------- 이벤트 ----------
let delArmed = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('#menu') && !(el && el.dataset.act === 'more')) hideMenu();
  if (!el) return;
  const a = el.dataset.act, key = el.dataset.list, i = +el.dataset.i;
  switch (a) {
    case 'go': go({ name: el.dataset.route, id: el.dataset.id }); break;
    case 'play':
      if ((key === 'search' || key === 'quick') && autoplayOn()) setQueue([lists[key][i]], 0, 'search');
      else setQueue(lists[key], i);
      break;
    case 'playall': if (lists[key].length) { store.shuffle = false; save(); setQueue(lists[key], 0); } break;
    case 'shuffleall': if (lists[key].length) { store.shuffle = true; save(); setQueue(lists[key], Math.floor(Math.random() * lists[key].length)); } break;
    case 'like': toggleLike(lists[key][i], listKind(key)); break;
    case 'likecur': if (current()) toggleLike(current()); break;
    case 'more': showMenu(el, key, i); break;
    case 'm-next': playNext(menuTrack); hideMenu(); break;
    case 'm-queue': addToQueue(menuTrack); hideMenu(); break;
    case 'm-like': toggleLike(menuTrack, menuKind); hideMenu(); break;
    case 'm-dislike': toggleDislike(menuTrack, menuKind); hideMenu(); break;
    case 'm-dl': downloadTrack(menuTrack, el.dataset.fmt); hideMenu(); break;
    case 'dlcur': if (current()) showDlMenu(el); break;
    case 'qdl': showDlMenu(el, lists.quick[i]); break;
    case 'dislikecur': dislikeCurrent(); break;
    case 'undislike': { const k = el.dataset.kind; toggleDislike(bucket(k).disliked[i].t, k); break; }
    case 'm-addpl': addToPlaylist(plById(el.dataset.id), menuTrack); hideMenu(); break;
    case 'm-newpl': { const p = newPlaylist(menuTrack); hideMenu(); toast(`'${p.name}'을 만들었어요`); renderAll(); break; }
    case 'm-remove': { const p = plById(menuKey.slice(3)); p.tracks.splice(menuIdx, 1); save(); hideMenu(); renderAll(); break; }
    case 'newpl': { const p = newPlaylist(); go({ name: 'playlist', id: p.id }); setTimeout(() => { const n = $('.pl-name'); n && n.select(); }, 0); break; }
    case 'delpl':
      if (delArmed !== el.dataset.id) { delArmed = el.dataset.id; el.textContent = '한 번 더 누르면 삭제'; break; }
      store.playlists = store.playlists.filter(p => p.id !== el.dataset.id); save(); delArmed = null; go({ name: 'home' }); break;
    case 'jump': Q.i = i; playCurrent(); break;
    case 'autoplaynow': {
      const [t] = Q.auto.splice(i, 1);
      Q.list.splice(Q.i + 1, 0, t); if (Q.base) Q.base.push(t);
      Q.i++; playCurrent();
      break;
    }
    case 'autoremove': Q.removed.add(Q.auto[i].id); Q.auto.splice(i, 1); renderQueue(); refillAuto(); break;
    case 'unqueue': Q.list.splice(i, 1); if (i < Q.i) Q.i--; renderQueue(); break;
    case 'toggle': togglePlay(); break;
    case 'prev': prev(); break;
    case 'next': skipNext(); break;
    case 'back10': seekBy(-10); break;
    case 'fwd10': seekBy(10); break;
    case 'voldown': setVolume(store.volume - 10); toast(`볼륨 ${store.volume}`); break;
    case 'volup': setVolume(store.volume + 10); toast(`볼륨 ${store.volume}`); break;
    case 'shuffle':
      store.shuffle = !store.shuffle;
      if (store.shuffle) applyShuffle();
      else if (Q.base) { const cur = current(); Q.list = Q.base; Q.base = null; Q.i = Math.max(0, Q.list.findIndex(t => cur && t.id === cur.id)); }
      save(); renderAll(); break;
    case 'repeat':
      store.repeat = { off: 'all', all: 'one', one: 'off' }[store.repeat]; save();
      autoSettingChanged(); renderNow();
      break;
    case 'video': go(route.name === 'video' ? lastRoute : { name: 'video' }); renderNow(); break;
    case 'queue': store.showQueue = !store.showQueue; save(); renderAll(); break;
    case 'quickclose': toggleQuick(false); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ liked: store.liked, playlists: store.playlists, disliked: store.disliked, video: { liked: store.video.liked, disliked: store.video.disliked } }, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = 'library.json'; link.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      break;
    }
  }
});

document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'search') return;
  e.preventDefault();
  const q = $('#m-q').value;
  searchState = { q, results: [], loading: true, error: '' };
  renderMain();
  try { searchState.results = await search(q); } catch (err) { searchState.error = err.message; }
  searchState.loading = false;
  if (route.name === 'search') renderMain();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.pl-name')) { const p = plById(t.dataset.pl); p.name = t.value.trim() || p.name; save(); renderLib(); }
  if (t.dataset.setting) { store.settings[t.dataset.setting] = t.value.trim(); save(); toast('저장했어요'); }
  if (t.dataset.settingBool) {
    store.settings[t.dataset.settingBool] = t.checked; save(); toast('저장했어요');
    autoSettingChanged();
  }
  if (t.id === 'import' && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      // 파일 내용은 믿지 않는다: 영상 ID 형식이 맞는 곡만, 필드는 필요한 것만 받아 온다
      const arr = a => (Array.isArray(a) ? a : []);
      const track = x => (x && /^[\w-]{11}$/.test(x.id) ? { id: x.id, title: String(x.title ?? x.id), channel: String(x.channel ?? ''), duration: String(x.duration ?? ''), seconds: +x.seconds || 0 } : null);
      const tracks = a => arr(a).map(track).filter(Boolean);
      // 좋아요·싫어요는 음악(최상위)과 영상(video) 쪽을 각각 합친다
      const merge = (src, k) => {
        const B = bucket(k);
        for (const x of tracks(src && src.liked)) if (!isLiked(x.id, k)) B.liked.push(x);
        for (const x of arr(src && src.disliked)) {
          const t = x && track(x.t);
          if (!t || isDisliked(t.id, k) || isLiked(t.id, k)) continue;
          B.disliked.push({ t, similar: arr(x.similar).filter(id => typeof id === 'string'), at: +x.at || 0, ...(x.liked ? { liked: true } : {}) });
        }
        if (B.disliked.length > 200) B.disliked.length = 200;
      };
      merge(d, 'music');
      merge(d.video, 'video');
      for (const p of arr(d.playlists)) {
        if (!p || !/^[\w-]{1,24}$/.test(p.id) || plById(p.id)) continue;
        store.playlists.push({ id: p.id, name: String(p.name || '가져온 플레이리스트'), tracks: tracks(p.tracks) });
      }
      save(); renderAll(); toast('가져왔어요');
    }).catch(() => toast('파일을 읽지 못했어요'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.pl-name')) e.target.blur(); });

// 빠른 패널 검색
let quickResults = [];
$('#q-input').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const ul = $('#q-results');
  ul.innerHTML = '<li>검색 중…</li>';
  try { quickResults = await search(e.target.value); } catch (err) { ul.innerHTML = `<li>${esc(err.message)}</li>`; return; }
  lists.quick = quickResults;
  ul.innerHTML = quickResults.slice(0, 10).map((t, i) => `<li data-act="play" data-list="quick" data-i="${i}"><span class="t">${esc(t.title)}</span><span class="d">${esc(t.duration)}</span><button data-act="qdl" data-i="${i}" title="MP3/MP4로 받기">${ic('download')}</button></li>`).join('') || '<li>결과가 없어요</li>';
});

// ---------- 단축키 ----------
window.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyM') { e.preventDefault(); setMode(mode === 'music' ? 'doc' : 'music'); return; }
  if (e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && e.code === 'KeyJ') { e.preventDefault(); toggleQuick(); return; }
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyK') { e.preventDefault(); panic(); return; }
  if (e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && e.code === 'KeyX') { e.preventDefault(); panic(); return; }
  // [ 는 문서·음악 화면 어디서든 재생/정지 (검색창·제목 같은 입력칸에서는 그대로 입력)
  if (e.code === 'BracketLeft' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); return; }
  if (e.ctrlKey && !e.altKey && !e.metaKey && e.code === 'Slash') { e.preventDefault(); $('#d-keys').hidden ? showKeys() : ($('#d-keys').hidden = true); return; }
  // 음악 단축키 (문서에 쓰는 중에도): Alt+. 다음 곡, Alt+, 이전 곡, Alt+L 좋아요, Alt+X 싫어요
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.code === 'Period') { e.preventDefault(); skipNext(); return; }
    if (e.code === 'Comma') { e.preventDefault(); prev(); return; }
    if (e.code === 'KeyL') { e.preventDefault(); const t = current(); if (t) { toggleLike(t); toast(isLiked(t.id) ? '좋아요에 추가했어요' : '좋아요를 취소했어요'); } return; }
    if (e.code === 'KeyX') { e.preventDefault(); dislikeCurrent(); return; }
  }
  // 문서 단축키: Ctrl+Shift+C 글자 수, Ctrl+Shift+> / < 글자 크기
  if (mode === 'doc' && e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) {
    if (e.code === 'KeyC') { e.preventDefault(); showCount(); return; }
    if ((e.code === 'Period' || e.code === 'Comma') && inDoc(document.activeElement)) { e.preventDefault(); applySize(currentPt() + (e.code === 'Period' ? 1 : -1)); return; }
  }
  if (e.key === 'Escape') {
    if (!$('#d-count').hidden) { $('#d-count').hidden = true; return; }
    if (!$('#d-keys').hidden) { $('#d-keys').hidden = true; return; }
    if (!$('#d-log').hidden) { $('#d-log').hidden = true; return; }
    if (!$('#d-chat').hidden) { openChat(false); return; }
    if (!dPop.hidden) { hidePop(); return; }
    if (!$('#menu').hidden) hideMenu();
    else if (quickOpen) toggleQuick(false);
    else if (mode === 'music') setMode('doc');
    return;
  }
  if (mode === 'music' && !typing && !e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'KeyV') { go(route.name === 'video' ? lastRoute : { name: 'video' }); renderNow(); }
  }
}, true);

// ---------- 친구 채팅 (문서의 '댓글' 창, 오른쪽 위 접속 표시) ----------
const chatEl = $('#d-chat'), chatList = $('#d-chat .dc-list'), chatDot = $('.d-right [data-doc="chat"] .d-dot');
const chat = { since: 0, msgs: [], online: [], timer: 0, busy: false, again: false };
const chatName = () => store.settings.chatName || '';
const nameColor = name => { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360; return `hsl(${h} 45% 45%)`; };
const nameCircle = (name, cls) => `<span class="${cls}" style="background:${nameColor(name)}" title="${esc(name)}">${esc([...name][0] || '?')}</span>`;
function chatTime(at) {
  const d = new Date(at), t = d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth() + 1}월 ${d.getDate()}일 ${t}`;
}
const setChatNote = t => { $('#d-chat .dc-note').textContent = t; };
async function chatRequest(body) {
  const r = await fetch(setting('chatUrl'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ ...body, name: chatName(), since: chat.since }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || r.status);
  return j;
}
function markChatSeen() {
  const last = chat.msgs.length ? chat.msgs[chat.msgs.length - 1].id : 0;
  if (last > (store.settings.chatSeen || 0)) { store.settings.chatSeen = last; save(); }
  chatDot.hidden = true;
}
function chatApply(j) {
  for (const m of j.messages || []) if (m.id > chat.since) { chat.msgs.push(m); chat.since = m.id; }
  chat.msgs = chat.msgs.slice(-100);
  chat.online = j.online || [];
  $('#d-people').innerHTML = chat.online.filter(n => n !== chatName()).map(n => nameCircle(n, 'd-avatar')).join('');
  if (!chatEl.hidden) markChatSeen();
  else chatDot.hidden = !chat.msgs.some(m => m.id > (store.settings.chatSeen || 0) && m.name !== chatName());
  renderChat();
}
function renderChat() {
  if (chatEl.hidden) return;
  const atBottom = chatList.scrollTop + chatList.clientHeight >= chatList.scrollHeight - 30;
  chatList.innerHTML = chat.msgs.map(m => `<div class="dc-msg"><div class="dc-who">${nameCircle(m.name, 'dc-av')}<div class="dc-name"><b>${esc(m.name)}</b><div class="dc-time">${chatTime(m.at)}</div></div></div><div class="dc-text">${esc(m.text)}</div></div>`).join('')
    || '<p class="dc-empty">아직 댓글이 없어요</p>';
  if (atBottom) chatList.scrollTop = chatList.scrollHeight;
}
// 창이 열려 있으면 3초, 닫혀 있으면 15초(접속 표시·새 글 점), 탭이 안 보이면 1분마다
function scheduleChat() {
  clearTimeout(chat.timer);
  if (chatName()) chat.timer = setTimeout(chatPoll, !chatEl.hidden ? 3000 : document.hidden ? 60000 : 15000);
}
async function chatPoll() {
  if (!chatName()) return;
  if (chat.busy) { chat.again = true; return; }
  chat.busy = true;
  try { chatApply(await chatRequest({ action: 'poll' })); setChatNote(''); }
  catch (e) { setChatNote('댓글을 불러오지 못했어요. 잠시 후 다시 시도해요.'); }
  finally {
    chat.busy = false;
    if (chat.again) { chat.again = false; chatPoll(); } else scheduleChat();
  }
}
async function chatSend(text) {
  if (!text.trim()) return false;
  try { chatApply(await chatRequest({ action: 'send', text })); setChatNote(''); return true; }
  catch (e) { setChatNote('댓글을 보내지 못했어요.'); return false; }
}
function openChat(open = chatEl.hidden) {
  chatEl.hidden = !open;
  if (!open) return scheduleChat();
  const named = !!chatName();
  $('#d-chat .dc-name').hidden = named;
  $('#d-chat .dc-form').hidden = !named;
  renderChat(); markChatSeen();
  if (named) { chatPoll(); setTimeout(() => $('#d-chat textarea').focus(), 0); }
  else setTimeout(() => $('#d-chat .dc-name input').focus(), 0);
}
$('#d-chat .dc-name').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#d-chat .dc-name input').value.trim().slice(0, 20);
  if (!v) return;
  store.settings.chatName = v; save();
  openChat(true);
});
$('#d-chat .dc-form').addEventListener('submit', async e => {
  e.preventDefault();
  const ta = $('#d-chat textarea');
  if (await chatSend(ta.value)) ta.value = '';
});
// Enter로 보내기, Shift+Enter는 줄바꿈. 한글 조합 중 Enter는 무시 (반쪽 글자가 보내지지 않게)
$('#d-chat textarea').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $('#d-chat .dc-form').requestSubmit(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) chatPoll(); });
chatPoll();

// 처음 온 사람에게만: 단축키 → 업데이트 내역. 띄우는 순간 봤음으로 저장해서 다시는 안 뜬다
if (FIRST_VISIT && !store.settings.introSeen) { store.settings.introSeen = true; save(); showKeys(true); }
</script>
</body>
</html>
