<!doctype html>

<head>

<title>제목 없는 문서 - Google Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Cpath d='M20 0H3a3 3 0 0 0-3 3v34a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V10z' fill='%234285f4'/%3E%3Cpath d='M20 0v7a3 3 0 0 0 3 3h7z' fill='%23a1c2fa'/%3E%3Cpath d='M7 18h16v2.4H7zm0 5h16v2.4H7zm0 5h16v2.4H7zm0 5h10v2.4H7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; background: #f9fbfd; color: #1f1f1f; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; }
  [hidden] { display: none !important; }

  /* ---------- 문서 화면 (Google Docs 모양) ---------- */
  #lovable-badge { display: none !important; }
  #doc { height: 100%; display: flex; flex-direction: column; font-family: "Google Sans", Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; background: #f9fbfd; }
  .ic { width: 20px; height: 20px; fill: currentColor; flex: none; display: block; }
  .ic.s { width: 18px; height: 18px; }
  .d-top { display: flex; align-items: center; padding: 8px 16px 0 12px; height: 64px; flex: none; }
  .d-icon { width: 30px; height: 40px; flex: none; margin: 0 10px 0 4px; }
  .d-head { min-width: 0; flex: 1; }
  .d-titlerow { display: flex; align-items: center; gap: 2px; color: #444746; }
  .d-title { font-size: 18px; line-height: 24px; font-family: inherit; border: 1px solid transparent; border-radius: 4px; padding: 0 6px; min-width: 40px; max-width: 420px; field-sizing: content; background: none; color: #1f1f1f; }
  .d-title:hover { border-color: #747775; }
  .d-title:focus { outline: none; border-color: #0b57d0; box-shadow: inset 0 0 0 1px #0b57d0; }
  .d-ib { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #444746; flex: none; }
  .d-ib:hover { background: rgba(68,71,70,.08); }
  .d-meta { font-size: 12px; color: #5f6368; margin-left: 6px; white-space: nowrap; }
  .d-menu { display: flex; font-size: 14px; color: #1f1f1f; margin-left: -1px; white-space: nowrap; overflow: hidden; }
  .d-menu span { padding: 2px 7px; border-radius: 4px; cursor: default; line-height: 20px; }
  .d-menu span:hover { background: rgba(68,71,70,.08); }
  .d-right { display: flex; align-items: center; gap: 6px; color: #444746; flex: none; }
  .d-rb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .d-rb:hover { background: rgba(68,71,70,.08); }
  .d-meet { display: flex; align-items: center; height: 36px; padding: 0 6px 0 10px; border-radius: 18px; }
  .d-meet:hover { background: rgba(68,71,70,.08); }
  .d-share { display: flex; align-items: center; gap: 8px; background: #c2e7ff; color: #001d35; border-radius: 24px; height: 40px; padding: 0 24px 0 16px; font-size: 14px; font-weight: 500; margin: 0 6px; }
  .d-share:hover { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
  .d-avatar { width: 32px; height: 32px; border-radius: 50%; background: #7b5ea7; color: #fff; display: grid; place-items: center; font-size: 14px; margin-left: 4px; }
  .d-tools { display: flex; align-items: center; gap: 1px; background: #edf2fa; margin: 6px 8px 0; border-radius: 24px; height: 40px; padding: 0 8px; font-size: 14px; color: #444746; flex: none; overflow: hidden; }
  .d-tools > * { flex: none; }
  .d-tb { height: 28px; min-width: 28px; padding: 0 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: #444746; cursor: default; }
  button.d-tb { cursor: pointer; }
  .d-tb:hover { background: rgba(68,71,70,.08); }
  .d-search { gap: 8px; padding: 0 12px 0 8px; height: 28px; border-radius: 14px; background: #fff0; color: #444746; }
  .d-dd { padding: 0 6px; }
  .d-dd .ic { width: 18px; height: 18px; }
  .d-font { min-width: 72px; justify-content: space-between; }
  .d-style { min-width: 92px; justify-content: space-between; }
  .d-size { display: inline-flex; align-items: center; }
  .d-size b { font-weight: 400; border: 1px solid #747775; border-radius: 4px; width: 34px; height: 24px; line-height: 22px; text-align: center; margin: 0 2px; color: #1f1f1f; }
  .d-color { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .d-color i { display: block; width: 16px; height: 3px; background: #000; margin-top: -3px; }
  .d-sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; }
  .d-mode { gap: 6px; padding: 0 8px; margin-left: auto; }
  .d-canvas { flex: 1; overflow: auto; position: relative; }
  .d-ruler { position: sticky; top: 0; z-index: 2; height: 24px; background: #f9fbfd; display: flex; justify-content: center; padding-top: 4px; }
  .d-ruler div { width: 816px; max-width: calc(100% - 32px); height: 18px; border-bottom: 1px solid #dadce0;
    background:
      linear-gradient(#dadce0, #dadce0) 0 0 / 96px 100% no-repeat,
      linear-gradient(#dadce0, #dadce0) 100% 0 / 96px 100% no-repeat,
      repeating-linear-gradient(90deg, #80868b 0 1px, transparent 1px 48px) 0 100% / 100% 8px no-repeat,
      repeating-linear-gradient(90deg, #bdc1c6 0 1px, transparent 1px 12px) 0 100% / 100% 4px no-repeat,
      #fff;
  }
  .d-outline { position: absolute; left: 20px; top: 40px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #444746; }
  .d-outline:hover { background: rgba(68,71,70,.08); }
  .d-pages { padding: 8px 0 80px; }
  .d-page { background: #fff; width: 816px; max-width: calc(100% - 32px); min-height: 1056px; margin: 0 auto; padding: 96px; border: 1px solid #c7c7c7; border-width: 0; box-shadow: 0 0 0 .75pt #d1d1d1, 0 0 3pt .75pt #ccc; font: 11pt/1.15 Arial, "Malgun Gothic", sans-serif; color: #000; outline: none; }
  .d-page h1 { font: 400 26pt/1.15 Arial, "Malgun Gothic", sans-serif; margin: 0 0 3pt; }
  .d-page h2 { font: 400 16pt/1.15 Arial, "Malgun Gothic", sans-serif; margin: 18pt 0 6pt; }
  .d-page p { margin: 0; }
  .d-page ul, .d-page ol { margin: 0; padding-left: 36pt; }
  .d-page li { padding-left: 4pt; }
  @media (max-width: 1180px) { .d-search span, .d-hide-m { display: none !important; } }
  @media (max-width: 900px) { .d-meet, .d-hide-s, .d-meta { display: none !important; } .d-page { padding: 48px 32px; } .d-outline { display: none; } }

  /* ---------- 음악 화면 ---------- */
  #music { position: fixed; inset: 0; background: #000; color: #fff; display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: 1fr 84px; gap: 8px; padding: 8px 8px 0; z-index: 20; }
  #music.no-queue { grid-template-columns: 240px 1fr; }
  #music.no-queue .m-queue { display: none; }
  .m-pan { background: #121212; border-radius: 8px; overflow: auto; min-height: 0; }
  .m-side { padding: 12px 8px; display: flex; flex-direction: column; }
  .m-nav { padding: 4px 4px 12px; }
  .m-nav button, .m-lib button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; color: #b3b3b3; font-size: 14px; }
  .m-nav button:hover, .m-lib button:hover { color: #fff; background: #1f1f1f; }
  .m-nav button.on, .m-lib button.on { color: #fff; background: #232323; }
  .m-label { color: #b3b3b3; font-size: 13px; font-weight: 700; padding: 10px 10px 6px; display: flex; justify-content: space-between; }
  .m-lib { flex: 1; overflow: auto; }
  .m-sq { width: 40px; height: 40px; border-radius: 4px; flex: none; object-fit: cover; background: #333; display: grid; place-items: center; font-size: 18px; }
  .m-libtxt { min-width: 0; }
  .m-libtxt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-libtxt small { color: #8a8a8a; font-size: 12px; }
  .m-main { padding: 16px 24px 40px; position: relative; }
  .m-main h2 { font-size: 24px; margin: 8px 0 14px; }
  .m-main h3 { font-size: 18px; margin: 24px 0 10px; }
  .m-searchbar { display: flex; gap: 8px; margin-bottom: 18px; }
  .m-searchbar input { flex: 1; background: #242424; color: #fff; border: 1px solid #333; border-radius: 22px; padding: 11px 18px; outline: none; }
  .m-searchbar input:focus { border-color: #fff; }
  .m-hint { color: #8a8a8a; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { background: #181818; border-radius: 8px; padding: 12px; text-align: left; transition: background .15s; }
  .card:hover { background: #262626; }
  .card img, .card .art { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #333; display: grid; place-items: center; font-size: 40px; }
  .card .t1 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .t2 { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { display: flex; gap: 20px; align-items: flex-end; padding: 20px; margin: -16px -24px 16px; background: linear-gradient(#7a3b2e, #121212); }
  .hero.liked { background: linear-gradient(#4a3a9c, #121212); }
  .hero .art { width: 150px; height: 150px; border-radius: 6px; flex: none; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,.5); background: #333; display: grid; place-items: center; font-size: 60px; }
  .hero small { color: #ddd; }
  .pl-name { background: none; border: 1px solid transparent; color: #fff; font-size: 40px; font-weight: 800; width: 100%; padding: 0 4px; border-radius: 4px; }
  .pl-name:hover, .pl-name:focus { border-color: #555; outline: none; }
  .hero h1 { font-size: 40px; margin: 4px 0; }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bigplay { width: 52px; height: 52px; border-radius: 50%; background: #ff7a59; color: #000; font-size: 20px; display: grid; place-items: center; }
  .bigplay:hover { transform: scale(1.04); background: #ff9070; }
  .pill { border: 1px solid #555; border-radius: 16px; padding: 6px 14px; font-size: 13px; color: #ddd; }
  .pill:hover { border-color: #fff; color: #fff; }
  .pill.danger { border-color: #a33; color: #f88; }
  .trk { display: grid; grid-template-columns: 28px 44px minmax(0, 1fr) 56px 30px 30px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; color: #b3b3b3; font-size: 14px; cursor: pointer; }
  .trk:hover { background: #2a2a2a; }
  .trk.cur { color: #ff8a65; }
  .trk.cur .t1 { color: #ff8a65; }
  .trk img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; background: #333; }
  .trk .n { text-align: center; }
  .trk .t1 { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .t2 { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk button { color: #8a8a8a; font-size: 16px; border-radius: 50%; width: 30px; height: 30px; }
  .trk button:hover { color: #fff; background: #3a3a3a; }
  .liked-on { color: #ff7a59 !important; }
  #video-slot { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; margin: 0 auto; display: grid; place-items: center; color: #666; }
  .m-queue { padding: 16px; }
  .m-queue h4 { margin: 0 0 8px; font-size: 15px; }
  .m-queue .trk { grid-template-columns: 40px minmax(0, 1fr) 26px; }
  .m-queue .trk img { width: 40px; height: 40px; }
  .m-bar { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(320px, 2fr) minmax(180px, 1fr); align-items: center; padding: 0 8px; }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #222; }
  .now .t1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .t2 { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ctl-btns { display: flex; align-items: center; gap: 18px; }
  .ctl-btns button { color: #b3b3b3; font-size: 17px; position: relative; }
  .ctl-btns button:hover { color: #fff; }
  .ctl-btns button.on { color: #ff7a59; }
  .ctl-btns .one { position: absolute; font-size: 9px; top: -4px; right: -6px; }
  .play { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000 !important; font-size: 14px !important; display: grid; place-items: center; }
  .seek { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; color: #a7a7a7; }
  .seek span { width: 40px; text-align: center; }
  input[type=range] { flex: 1; accent-color: #ff7a59; height: 4px; cursor: pointer; }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #b3b3b3; }
  .right button:hover { color: #fff; }
  .right button.on { color: #ff7a59; }
  .right input[type=range] { max-width: 110px; }
  .set label { display: block; margin: 14px 0 4px; color: #ddd; font-size: 14px; }
  .set input[type=text] { width: 100%; max-width: 560px; background: #242424; color: #fff; border: 1px solid #333; border-radius: 6px; padding: 9px 12px; }

  /* ---------- 빠른 패널 ---------- */
  #quick { position: fixed; right: 20px; bottom: 20px; width: 340px; max-width: calc(100vw - 32px); background: #fff; border: 1px solid #dadce0; border-radius: 12px; box-shadow: 0 6px 24px rgba(60,64,67,.25); padding: 12px; z-index: 40; font-size: 13px; color: #3c4043; }
  #quick .q-head { display: flex; justify-content: space-between; color: #5f6368; margin-bottom: 6px; }
  #quick input[type=text] { width: 100%; border: 1px solid #dadce0; border-radius: 6px; padding: 8px 10px; outline: none; }
  #quick input[type=text]:focus { border-color: #1a73e8; }
  #quick ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 220px; overflow: auto; }
  #quick li { padding: 6px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  #quick li:hover { background: #f1f3f4; }
  #quick li .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #quick li .d { color: #80868b; }
  #quick .q-now { border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; }
  #quick .q-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #202124; }
  #quick .q-seek { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #80868b; margin: 4px 0; }
  #quick input[type=range] { accent-color: #1a73e8; }
  #quick .q-ctl { display: flex; justify-content: space-between; gap: 4px; }
  #quick .q-ctl button { flex: 1; background: #f1f3f4; border-radius: 6px; padding: 5px 0; font-size: 12px; color: #3c4043; }
  #quick .q-ctl button:hover { background: #e8eaed; }

  /* ---------- 플레이어 / 기타 ---------- */
  #yt-wrap { position: fixed; z-index: 30; }
  #yt-wrap.hide { left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
  #yt-wrap.show { border-radius: 8px; overflow: hidden; }
  #yt-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  #menu { position: fixed; z-index: 60; background: #282828; color: #eee; border-radius: 6px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 14px; max-height: 60vh; overflow: auto; }
  #menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 4px; }
  #menu button:hover { background: #3e3e3e; }
  #menu hr { border: 0; border-top: 1px solid #3e3e3e; margin: 4px 0; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #323232; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 70; pointer-events: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  #music ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 5px; }
</style>
</head>

// ---------- 대기열 ----------
// source: 'search'(검색에서 한 곡) | 'list'(플레이리스트 등). auto: 대기열 뒤에 이어질 추천 곡(최대 5). removed: 이번 세션에 ✕로 뺀 추천 곡
const Q = { list: [], i: -1, base: null, source: 'list', auto: [], removed: new Set(), gen: 0 };
const current = () => Q.list[Q.i] || null;

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function applyShuffle() {
  const cur = current();
  Q.base = Q.list.slice();
  const rest = Q.list.filter((_, k) => k !== Q.i);
  Q.list = cur ? [cur, ...shuffleArr(rest)] : shuffleArr(rest);
  Q.i = cur ? 0 : -1;
}
function setQueue(list, i, source = 'list') {
  Q.list = list.map(slim); Q.i = i; Q.base = null;
  Q.source = source; Q.auto = []; Q.gen++;
  if (store.shuffle) applyShuffle();
  playCurrent();
}
function playCurrent() {
  const t = current();
  if (!t) return;
  counted = false;
  if (playerReady) player.loadVideoById(t.id); else pendingId = t.id;
  store.recent = [slim(t), ...store.recent.filter(x => x.id !== t.id)].slice(0, 30);
  save();
  renderAll();
  refillAuto();
}
function next(auto) {
  if (!Q.list.length) return;
  if (auto && store.repeat === 'one') { player.seekTo(0, true); player.playVideo(); return; }
  if (Q.i + 1 < Q.list.length) { Q.i++; return playCurrent(); }
  if (useAuto()) {
    if (takeAuto()) return playCurrent();
    // 추천을 아직 못 받았으면 받아 보고, 그래도 없으면 예전처럼
    const gen = Q.gen;
    refillAuto().then(() => {
      if (gen !== Q.gen || Q.i + 1 < Q.list.length) return;
      if (takeAuto()) playCurrent(); else endOfList(auto);
    });
    return;
  }
  endOfList(auto);
}
function endOfList(auto) {
  if (store.repeat === 'all' || !auto) { Q.i = 0; playCurrent(); } else renderAll();
}
// 재생 기록: 30초 이상 또는 절반 이상 들으면 곡당 한 번 plays, 처음 30초 안에 다음 버튼이면 skips
let counted = false;
const STATS_MAX = 500;
function statFor(t) {
  const s = store.stats[t.id] || (store.stats[t.id] = { t: slim(t), plays: 0, skips: 0, last: 0 });
  s.last = Date.now();
  const ids = Object.keys(store.stats);
  if (ids.length > STATS_MAX) ids.sort((a, b) => store.stats[a].last - store.stats[b].last).slice(0, ids.length - STATS_MAX).forEach(id => delete store.stats[id]);
  return s;
}
function noteListen() {
  const t = current(), c = curTime(), d = durTime();
  if (counted || !t || !(c >= 30 || (d && c >= d / 2))) return;
  counted = true;
  statFor(t).plays++;
  save();
}
function noteSkip() {
  const t = current();
  if (t && curTime() < 30) { statFor(t).skips++; save(); }
}
function prev() {
  if (!Q.list.length) return;
  if (curTime() > 3) { player.seekTo(0, true); return; }

}

}
function playNext(t) {

// ---------- 자동 추천 (순수 함수) ----------
// @@autoplay-pure-start
// mine: 내 기록, mix: 지금 곡의 YouTube 믹스, taste: 내 취향 곡의 믹스, popular: 인기 음악
const AUTO_WEIGHTS = { mine: 50, mix: 30, taste: 15, popular: 5 };
function scoreOf(stat, liked) {
  return (stat ? stat.plays - 2 * stat.skips : 0) + (liked ? 3 : 0);
}
function minePool(stats, likedTracks) {
  const liked = new Set(likedTracks.map(t => t.id));
  const pool = [];
  for (const id in stats) {
    const w = scoreOf(stats[id], liked.has(id));
    if (w > 0) pool.push({ t: stats[id].t, w });
  }
  for (const t of likedTracks) if (!stats[t.id]) pool.push({ t, w: scoreOf(undefined, true) });
  return pool;
}
// 비중대로 묶음을 고르고 그 안에서 한 곡. 제외 후 후보가 남은 묶음만 고려하므로 모두 비면 null.
function pickNext(pools, weights, exclude, rng) {
  const avail = {};
  let total = 0;
  for (const k in weights) {
    const items = (pools[k] || []).map(x => (x.t ? x : { t: x, w: 1 })).filter(x => !exclude.has(x.t.id));
    if (items.length) { avail[k] = items; total += weights[k]; }
  }
  if (!total) return null;
  let r = rng() * total, from;
  for (from in avail) { r -= weights[from]; if (r < 0) break; }
  const items = avail[from];
  let w = rng() * items.reduce((s, x) => s + x.w, 0);
  for (const x of items) { w -= x.w; if (w < 0) return { t: x.t, from }; }
  return { t: items[items.length - 1].t, from };
}
// @@autoplay-pure-end

// ---------- 자동 추천 (대기열 연결) ----------
const autoplayOn = () => store.settings.autoplay !== false;
// 검색에서 시작했으면 전체 반복이어도 추천을 계속한다
const useAuto = () => autoplayOn() && (Q.source === 'search' || store.repeat !== 'all');
function takeAuto() {
  const t = Q.auto.shift();
  if (!t) return false;
  Q.list.push(t); if (Q.base) Q.base.push(t);
  Q.i = Q.list.length - 1;
  return true;
}
const mixCache = new Map();
function fetchMix(id) {
  if (!mixCache.has(id)) {
    mixCache.set(id, fetch(setting('searchUrl') + '?mix=' + encodeURIComponent(id))
      .then(r => r.json()).then(j => j.results || []).catch(() => []));
  }
  return mixCache.get(id);
}
let popularP = null;
const fetchPopular = () => popularP || (popularP = search('인기 음악').catch(() => []));
let refilling = null;
function refillAuto() {
  if (refilling) return refilling;
  if (!useAuto() || Q.auto.length >= 5 || !current() || Q.list.length - Q.i - 1 > 2) return Promise.resolve();
  const gen = Q.gen;
  refilling = (async () => {
    const mine = minePool(store.stats, store.liked);
    const seed = Q.list[Q.list.length - 1];
    const exclude = new Set([...store.recent.slice(0, 20), ...Q.list, ...Q.auto].map(t => t.id).concat([...Q.removed]));
    let mix = await fetchMix(seed.id);
    if (mix.filter(t => !exclude.has(t.id)).length < 5) {
      // 기준 곡 믹스가 거의 떨어졌으면 가장 최근에 제대로 들은 곡의 믹스로 보충
      const lastHeard = Object.values(store.stats).filter(x => x.plays > 0 && x.t.id !== seed.id).sort((a, b) => b.last - a.last)[0];
      if (lastHeard) mix = mix.concat(await fetchMix(lastHeard.t.id));
    }
    const top = mine.slice().sort((a, b) => b.w - a.w).slice(0, 10);
    const taste = top.length ? await fetchMix(top[Math.floor(Math.random() * top.length)].t.id) : [];
    const popular = await fetchPopular();
    if (gen !== Q.gen) return;
    const pools = { mine, mix, taste, popular };
    while (Q.auto.length < 5) {
      const p = pickNext(pools, AUTO_WEIGHTS, exclude, Math.random);
      if (!p) break;
      Q.auto.push(slim(p.t)); exclude.add(p.t.id);
    }
    renderQueue();
  })().finally(() => { refilling = null; });
  return refilling;
}

function parseId(s) {
  const m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(s.trim()) ? s.trim() : null);
}
async function search(q) {
  q = q.trim();
  if (!q) return [];
  const id = parseId(q);
  if (id) return [{ id, title: id, channel: '링크로 추가', duration: '', seconds: 0 }];
  let why = '';
  const gas = setting('searchUrl');
  if (gas) {
    try {
      const j = await (await fetch(gas + '?q=' + encodeURIComponent(q))).json();
      if (j.results && j.results.length) return j.results;
      why = j.error || '결과 없음';
    } catch (e) { why = e.message; }
  }
  try {
    const r = await fetch(setting('invidious') + '/api/v1/search?type=video&q=' + encodeURIComponent(q));
    const j = await r.json();
    const out = j.filter(x => x.type === 'video' && x.lengthSeconds > 0)
      .map(x => ({ id: x.videoId, title: x.title, channel: x.author, seconds: x.lengthSeconds, duration: fmt(x.lengthSeconds) }));
    if (out.length) return out;
  } catch (e) {}
  throw new Error('검색 실패' + (why ? ` (${why})` : ''));
}

  } else if (r.name === 'liked') {
    el.innerHTML = `
      <div class="hero liked"><div class="art" style="background:linear-gradient(135deg,#4a3a9c,#9fd3ff)">♥</div><div><small>플레이리스트</small><h1>좋아요 표시한 곡</h1><small>${store.liked.length}곡</small></div></div>
      <div class="actions"><button class="bigplay" data-act="playall" data-list="liked">▶</button><button class="pill" data-act="shuffleall" data-list="liked">셔플 재생</button></div>
      ${trackRows('liked', store.liked, { empty: '♥를 누른 곡이 여기에 모여요' })}`;
  } else if (r.name === 'playlist') {
    const p = plById(r.id);
    if (!p) return go({ name: 'home' });
    const key = 'pl:' + p.id;
    el.innerHTML = `
      <div class="hero">${p.tracks[0] ? `<img class="art" src="${thumb(p.tracks[0].id)}" alt="">` : '<div class="art">♫</div>'}
        <div style="flex:1;min-width:0"><small>플레이리스트</small><input class="pl-name" data-pl="${p.id}" value="${esc(p.name)}" spellcheck="false"><small>${p.tracks.length}곡 · ${fmt(p.tracks.reduce((a, t) => a + (t.seconds || 0), 0))}</small></div></div>
      <div class="actions"><button class="bigplay" data-act="playall" data-list="${key}">▶</button><button class="pill" data-act="shuffleall" data-list="${key}">셔플 재생</button><button class="pill danger" data-act="delpl" data-id="${p.id}">삭제</button></div>
      ${trackRows(key, p.tracks, { empty: '검색 결과의 ⋯ 메뉴에서 이 플레이리스트에 곡을 추가하세요' })}`;
  } else if (r.name === 'video') {
    const t = current();
    el.innerHTML = `
      <div id="video-slot">${t ? '' : '재생 중인 곡이 없어요'}</div>
      ${t ? `<h2 style="margin-top:16px">${esc(t.title)}</h2><p class="m-hint">${esc(t.channel)} · V 또는 📺로 닫기</p>` : ''}`;
  } else if (r.name === 'settings') {
    el.innerHTML = `
      <h2>설정</h2>
      <div class="set">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-setting-bool="autoplay" ${autoplayOn() ? 'checked' : ''}> 자동 추천 (곡이 끝나면 어울리는 곡을 이어서 재생)</label>
        <label>검색 서버 주소 (Google Apps Script 웹앱 /exec)</label>
        <input type="text" data-setting="searchUrl" value="${esc(store.settings.searchUrl || '')}" placeholder="${esc(CONFIG.searchUrl || 'https://script.google.com/macros/s/.../exec')}">
        <label>예비 검색 (Invidious 서버)</label>
        <input type="text" data-setting="invidious" value="${esc(store.settings.invidious || '')}" placeholder="${esc(CONFIG.invidious)}">
        <label>Alt+K 로 이동할 주소</label>
        <input type="text" data-setting="panicUrl" value="${esc(store.settings.panicUrl || '')}" placeholder="${esc(CONFIG.panicUrl)}">
        <h3>라이브러리 옮기기</h3>
        <p class="m-hint">좋아요·플레이리스트는 이 브라우저에만 저장돼요. 다른 PC로 옮길 때 파일로 내보내고 가져오세요.</p>
        <div class="actions"><button class="pill" data-act="export">내보내기 (.json)</button><label class="pill" style="margin:0;cursor:pointer">가져오기<input type="file" id="import" accept=".json,application/json" hidden></label></div>
        <h3>단축키</h3>
        <p class="m-hint">Alt+M 음악 화면 · Ctrl+J 빠른 패널 · Ctrl+X 또는 Alt+K 긴급 탈출 · [ 어디서나 재생/정지 · Esc 문서로 · Space 재생/정지 · V 영상</p>
      </div>`;
  }
  placePlayer();
}

function greeting() {
  const h = new Date().getHours();
  return h < 6 ? '늦은 밤이에요' : h < 12 ? '좋은 아침이에요' : h < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
}

function renderQueue() {
  if (mode !== 'music') return;
  const cur = current();
  const upcoming = Q.list.slice(Q.i + 1).map((t, k) => ({ t, k: Q.i + 1 + k }));
  lists.queue = Q.list;
  $('#queue').innerHTML = `
    <h4>지금 재생 중</h4>
    ${cur ? `<div class="trk cur"><img src="${thumb(cur.id)}" alt=""><div style="min-width:0"><div class="t1">${esc(cur.title)}</div><div class="t2">${esc(cur.channel)}</div></div><span></span></div>` : '<p class="m-hint">없음</p>'}
    <h4 style="margin-top:18px">다음 곡</h4>
    ${upcoming.length ? upcoming.map(({ t, k }) => `
      <div class="trk" data-act="jump" data-i="${k}"><img src="${thumb(t.id)}" alt="" loading="lazy"><div style="min-width:0"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.channel)}</div></div><button data-act="unqueue" data-i="${k}" title="빼기">✕</button></div>`).join('')
      : `<p class="m-hint">${store.repeat === 'all' && Q.list.length ? '처음부터 다시 재생돼요' : '비어 있어요'}</p>`}`;
}

function renderNow() {
  const t = current();
  $('#now').innerHTML = t ? `
    <img src="${thumb(t.id)}" alt="">
    <div style="min-width:0"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.channel)}</div></div>
    <button data-act="likecur" class="${isLiked(t.id) ? 'liked-on' : ''}" style="color:#b3b3b3" title="좋아요">♥</button>` : '';
  $('#b-shuffle').classList.toggle('on', store.shuffle);
  $('#b-repeat').classList.toggle('on', store.repeat !== 'off');
  $('#b-repeat').innerHTML = '↻' + (store.repeat === 'one' ? '<span class="one">1</span>' : '');
  $('#b-video').classList.toggle('on', route.name === 'video');
  $('#b-queue').classList.toggle('on', store.showQueue);
  $('#music').classList.toggle('no-queue', !store.showQueue);
  renderPlayState();
}
function renderPlayState() {
  $('#b-play').textContent = playing ? '⏸' : '▶';
  $('#q-play').textContent = playing ? '⏸' : '▶';
  document.querySelectorAll('.trk.cur .n').forEach(n => { n.textContent = playing ? '♪' : n.dataset.n; });
}
function renderQuickNow() {
  const t = current();
  $('#q-now').hidden = !t;
  if (t) $('#q-title').textContent = t.title;
}
function renderAll() {
  renderQuickNow();
  if (mode !== 'music') return;
  renderLib(); renderMain(); renderQueue(); renderNow();
}

// 진행바 갱신
let dragging = false;
setInterval(() => {
  if (!current()) return;
  noteListen();
  if (dragging) return;
  const c = curTime(), d = durTime();
  const v = d ? Math.round((c / d) * 1000) : 0;
  if (mode === 'music') { $('#seek').value = v; $('#t-cur').textContent = fmt(c); $('#t-dur').textContent = fmt(d); }
  if (quickOpen) { $('#q-seek').value = v; $('#q-cur').textContent = fmt(c); $('#q-dur').textContent = fmt(d); }
}, 500);
for (const id of ['#seek', '#q-seek']) {
  const el = $(id);
  el.addEventListener('input', () => { dragging = true; });
  el.addEventListener('change', () => { dragging = false; if (playerReady && current()) player.seekTo((el.value / 1000) * durTime(), true); });
}
$('#vol').value = store.volume;
$('#vol').addEventListener('input', e => setVolume(+e.target.value));

// ---------- 메뉴 / 토스트 ----------
let menuTrack = null, menuKey = null, menuIdx = -1;
function showMenu(btn, key, i) {
  menuTrack = lists[key][i]; menuKey = key; menuIdx = i;
  const m = $('#menu');
  m.innerHTML = `
    <button data-act="m-next">다음에 재생</button>
    <button data-act="m-queue">대기열에 추가</button>
    <button data-act="m-like">${isLiked(menuTrack.id) ? '좋아요 취소' : '좋아요'}</button>
    <hr>
    ${store.playlists.map(p => `<button data-act="m-addpl" data-id="${p.id}">＋ ${esc(p.name)}</button>`).join('')}
    <button data-act="m-newpl">＋ 새 플레이리스트에 추가</button>
    ${key.startsWith('pl:') ? '<hr><button data-act="m-remove">이 플레이리스트에서 제거</button>' : ''}`;
  m.hidden = false;
  const r = btn.getBoundingClientRect();
  const h = m.offsetHeight, w = m.offsetWidth;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h > innerHeight - 8 ? Math.max(8, r.top - h) : r.bottom) + 'px';
}
function hideMenu() { $('#menu').hidden = true; }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

// ---------- 라이브러리 조작 ----------
function toggleLike(t) {
  if (isLiked(t.id)) store.liked = store.liked.filter(x => x.id !== t.id);
  else store.liked.unshift(slim(t));
  save(); renderAll();
}
function newPlaylist(withTrack) {
  const p = { id: Date.now().toString(36), name: `내 플레이리스트 #${store.playlists.length + 1}`, tracks: withTrack ? [slim(withTrack)] : [] };
  store.playlists.push(p); save();
  return p;
}
function addToPlaylist(p, t) {
  if (p.tracks.some(x => x.id === t.id)) return toast('이미 들어 있는 곡이에요');
  p.tracks.push(slim(t)); save(); toast(`'${p.name}'에 추가했어요`); renderAll();
}

// ---------- 이벤트 ----------
let delArmed = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('#menu') && !(el && el.dataset.act === 'more')) hideMenu();
  if (!el) return;
  const a = el.dataset.act, key = el.dataset.list, i = +el.dataset.i;
  switch (a) {
    case 'go': go({ name: el.dataset.route, id: el.dataset.id }); break;
    case 'play':
      if ((key === 'search' || key === 'quick') && autoplayOn()) setQueue([lists[key][i]], 0, 'search');
      else setQueue(lists[key], i);
      break;
    case 'playall': if (lists[key].length) { store.shuffle = false; save(); setQueue(lists[key], 0); } break;
    case 'shuffleall': if (lists[key].length) { store.shuffle = true; save(); setQueue(lists[key], Math.floor(Math.random() * lists[key].length)); } break;
    case 'like': toggleLike(lists[key][i]); break;
    case 'likecur': if (current()) toggleLike(current()); break;
    case 'more': showMenu(el, key, i); break;
    case 'm-next': playNext(menuTrack); hideMenu(); break;
    case 'm-queue': addToQueue(menuTrack); hideMenu(); break;
    case 'm-like': toggleLike(menuTrack); hideMenu(); break;
    case 'm-addpl': addToPlaylist(plById(el.dataset.id), menuTrack); hideMenu(); break;
    case 'm-newpl': { const p = newPlaylist(menuTrack); hideMenu(); toast(`'${p.name}'을 만들었어요`); renderAll(); break; }
    case 'm-remove': { const p = plById(menuKey.slice(3)); p.tracks.splice(menuIdx, 1); save(); hideMenu(); renderAll(); break; }
    case 'newpl': { const p = newPlaylist(); go({ name: 'playlist', id: p.id }); setTimeout(() => { const n = $('.pl-name'); n && n.select(); }, 0); break; }
    case 'delpl':
      if (delArmed !== el.dataset.id) { delArmed = el.dataset.id; el.textContent = '한 번 더 누르면 삭제'; break; }
      store.playlists = store.playlists.filter(p => p.id !== el.dataset.id); save(); delArmed = null; go({ name: 'home' }); break;
    case 'jump': Q.i = i; playCurrent(); break;
    case 'unqueue': Q.list.splice(i, 1); if (i < Q.i) Q.i--; renderQueue(); break;
    case 'toggle': togglePlay(); break;
    case 'prev': prev(); break;
    case 'next': noteSkip(); next(false); break;
    case 'back10': seekBy(-10); break;
    case 'fwd10': seekBy(10); break;
    case 'voldown': setVolume(store.volume - 10); toast(`볼륨 ${store.volume}`); break;
    case 'volup': setVolume(store.volume + 10); toast(`볼륨 ${store.volume}`); break;
    case 'shuffle':
      store.shuffle = !store.shuffle;
      if (store.shuffle) applyShuffle();
      else if (Q.base) { const cur = current(); Q.list = Q.base; Q.base = null; Q.i = Math.max(0, Q.list.findIndex(t => cur && t.id === cur.id)); }
      save(); renderAll(); break;
    case 'repeat': store.repeat = { off: 'all', all: 'one', one: 'off' }[store.repeat]; save(); renderNow(); renderQueue(); break;
    case 'video': go(route.name === 'video' ? lastRoute : { name: 'video' }); renderNow(); break;
    case 'queue': store.showQueue = !store.showQueue; save(); renderAll(); break;
    case 'quickclose': toggleQuick(false); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ liked: store.liked, playlists: store.playlists }, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = 'library.json'; link.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      break;
    }
  }
});

document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'search') return;
  e.preventDefault();
  const q = $('#m-q').value;
  searchState = { q, results: [], loading: true, error: '' };
  renderMain();
  try { searchState.results = await search(q); } catch (err) { searchState.error = err.message; }
  searchState.loading = false;
  if (route.name === 'search') renderMain();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.pl-name')) { const p = plById(t.dataset.pl); p.name = t.value.trim() || p.name; save(); renderLib(); }
  if (t.dataset.setting) { store.settings[t.dataset.setting] = t.value.trim(); save(); toast('저장했어요'); }
  if (t.dataset.settingBool) {
    store.settings[t.dataset.settingBool] = t.checked; save(); toast('저장했어요');
    if (autoplayOn()) refillAuto(); else { Q.auto = []; renderQueue(); }
  }
  if (t.id === 'import' && t.files[0]) {
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      for (const x of d.liked || []) if (!isLiked(x.id)) store.liked.push(x);
      for (const p of d.playlists || []) if (!plById(p.id)) store.playlists.push(p);
      save(); renderAll(); toast('가져왔어요');
    }).catch(() => toast('파일을 읽지 못했어요'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.pl-name')) e.target.blur(); });

// 빠른 패널 검색
let quickResults = [];
$('#q-input').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const ul = $('#q-results');
  ul.innerHTML = '<li>검색 중…</li>';
  try { quickResults = await search(e.target.value); } catch (err) { ul.innerHTML = `<li>${esc(err.message)}</li>`; return; }
  lists.quick = quickResults;
  ul.innerHTML = quickResults.slice(0, 10).map((t, i) => `<li data-act="play" data-list="quick" data-i="${i}"><span class="t">${esc(t.title)}</span><span class="d">${esc(t.duration)}</span></li>`).join('') || '<li>결과가 없어요</li>';
});

// ---------- 단축키 ----------
window.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyM') { e.preventDefault(); setMode(mode === 'music' ? 'doc' : 'music'); return; }
  if (e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && e.code === 'KeyJ') { e.preventDefault(); toggleQuick(); return; }
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyK') { e.preventDefault(); panic(); return; }
  if (e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && e.code === 'KeyX') { e.preventDefault(); panic(); return; }
  // [ 는 문서·음악 화면 어디서든 재생/정지 (검색창·제목 같은 입력칸에서는 그대로 입력)
  if (e.code === 'BracketLeft' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) hideMenu();
    else if (quickOpen) toggleQuick(false);
    else if (mode === 'music') setMode('doc');
    return;
  }
  if (mode === 'music' && !typing && !e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'KeyV') { go(route.name === 'video' ? lastRoute : { name: 'video' }); renderNow(); }
  }
}, true);
</script>
</body>
</html>
